name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx==0.27.2 pytest==8.3.3
      - run: |
          ulimit -v 2097152
          python -m pytest -q
